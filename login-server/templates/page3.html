{% extends "base.html" %}
{% block title %}AUTH2FA — Log In{% endblock %}

{% block nav_steps %}
<div class="step-bar" style="margin-left:auto">
    <span class="s done">1·SIGNUP</span>
    <span class="s done">2·EXCHANGE</span>
    <span class="s active">3·LOGIN</span>
    <span class="s">4·2FA</span>
</div>
{% endblock %}

{% block content %}
<div class="card">
    <div class="page-tag">STEP 3 OF 4</div>
    <h1>Log <span class="accent">In</span></h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('page_3') }}" method="GET">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   placeholder="Your username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">LOGIN →</button>
    </form>

    <div class="link-row">No account? <a href="{{ url_for('page_2') }}">Sign up first</a></div>
</div>
{% endblock %}
